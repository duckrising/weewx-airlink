# skins/airlink/lang/da.conf
#
# Danish -- Dansk.  WeeWX's Seasons skin ships no Danish lang file, so the
# plot-period tabs and "History" are not copied from a Seasons original.
# Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Observation labels: the page's readouts, and the y-axis/legend
        # label of the PNG plots.  Decimal comma, as everywhere in Danish.
        pm2_5_aqi = Luftkvalitetsindeks
        pm1_0     = "PM1,0"
        pm2_5     = "PM2,5"
        pm10_0    = PM10

# The " AQI" and " RGB" unit labels are deliberately NOT here: airlink.py
# registers them globally, WeeWX reads them from there, and an entry in
# this file would have no effect.  Both are acronyms and stay untranslated.

[ImageGenerator]

    [[year_images]]

        # Day/month rather than the US month/day order
        x_label_format = %d/%m

[Texts]

    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "Luftkvalitet i {location}"
    "Air Quality" = "Luftkvalitet"
    "Unavailable" = "Ikke tilgængelig"

    # Card headings
    "Right now" = "Lige nu"
    "The last 24 hours, hour by hour" = "De seneste 24 timer, time for time"
    "History" = "Historik"

    # Stat tiles
    "Today's peak" = "Dagens højeste"
    "Today's average" = "Dagens gennemsnit"
    "Today's low" = "Dagens laveste"
    "Hours above Good" = "Timer over God"
    "in the last 24 hours" = "inden for de seneste 24 timer"

    # The six US EPA AQI categories, lowest first
    "Good" = "God"
    "Moderate" = "Moderat"
    "Unhealthy for Sensitive Groups" = "Usund for følsomme grupper"
    "Unhealthy" = "Usund"
    "Very Unhealthy" = "Meget usund"
    "Hazardous" = "Farlig"

    # One health sentence per category, in the same order
    "Air quality is satisfactory, and air pollution poses little or no risk." = "Luftkvaliteten er tilfredsstillende, og luftforureningen udgør ingen eller kun en lille risiko."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Acceptabel.  Usædvanligt følsomme personer bør overveje at begrænse langvarig anstrengelse udendørs."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "Følsomme grupper kan opleve helbredsmæssige virkninger.  Den brede befolkning er mindre tilbøjelig til at blive påvirket."
    "Some members of the general public may experience health effects." = "Nogle i den brede befolkning kan opleve helbredsmæssige virkninger."
    "Health alert: the risk of health effects is increased for everyone." = "Sundhedsadvarsel: risikoen for helbredsmæssige virkninger er øget for alle."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Sundhedsvarsel om nødsituation: alle er mere tilbøjelige til at blive påvirket."

    # Plot-period tabs
    "Day" = "Dag"
    "Week" = "Uge"
    "Month" = "Måned"
    "Year" = "År"

# skins/airlink/lang/sv.conf
#
# Swedish -- Svenska.  WeeWX's Seasons skin ships no Swedish lang file, so
# the plot-period tabs and "History" are not copied from a Seasons
# original.  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Observation labels: the page's readouts, and the y-axis/legend
        # label of the PNG plots.  Decimal comma, as everywhere in Swedish.
        pm2_5_aqi = Luftkvalitetsindex
        pm1_0     = "PM1,0"
        pm2_5     = "PM2,5"
        pm10_0    = PM10

# The " AQI" and " RGB" unit labels are deliberately NOT here: airlink.py
# registers them globally, WeeWX reads them from there, and an entry in
# this file would have no effect.  Both are acronyms and stay untranslated.

[ImageGenerator]

    [[year_images]]

        # Day/month rather than the US month/day order
        x_label_format = %d/%m

[Texts]

    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "Luftkvalitet i {location}"
    "Air Quality" = "Luftkvalitet"
    "Unavailable" = "Inte tillgänglig"

    # Card headings
    "Right now" = "Just nu"
    "The last 24 hours, hour by hour" = "De senaste 24 timmarna, timme för timme"
    "History" = "Historik"

    # Stat tiles
    "Today's peak" = "Dagens högsta"
    "Today's average" = "Dagens medelvärde"
    "Today's low" = "Dagens lägsta"
    "Hours above Good" = "Timmar över Bra"
    "in the last 24 hours" = "under de senaste 24 timmarna"

    # The six US EPA AQI categories, lowest first
    "Good" = "Bra"
    "Moderate" = "Måttlig"
    "Unhealthy for Sensitive Groups" = "Ohälsosam för känsliga grupper"
    "Unhealthy" = "Ohälsosam"
    "Very Unhealthy" = "Mycket ohälsosam"
    "Hazardous" = "Farlig"

    # One health sentence per category, in the same order
    "Air quality is satisfactory, and air pollution poses little or no risk." = "Luftkvaliteten är tillfredsställande och luftföroreningarna utgör liten eller ingen risk."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Godtagbar.  Ovanligt känsliga personer bör överväga att begränsa långvarig ansträngning utomhus."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "Känsliga grupper kan få hälsoeffekter.  Allmänheten påverkas sannolikt i mindre grad."
    "Some members of the general public may experience health effects." = "Vissa personer i allmänheten kan få hälsoeffekter."
    "Health alert: the risk of health effects is increased for everyone." = "Hälsovarning: risken för hälsoeffekter är förhöjd för alla."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Hälsovarning för nödläge: alla löper större risk att påverkas."

    # Plot-period tabs
    "Day" = "Dag"
    "Week" = "Vecka"
    "Month" = "Månad"
    "Year" = "År"

# skins/airlink/lang/no.conf
#
# Norwegian (Bokmål) -- Norsk.  The plot-period tabs (Dag, Uke, Måned, År)
# and "History" (Historie) are copied verbatim from the Norwegian lang file
# of WeeWX's own Seasons skin (a test pins this).  Corrections welcome --
# file an issue at https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Observation labels: the page's readouts, and the y-axis/legend
        # label of the PNG plots.  Decimal comma, as everywhere in Norwegian.
        pm2_5_aqi = Luftkvalitetsindeks
        pm1_0     = "PM1,0"
        pm2_5     = "PM2,5"
        pm10_0    = PM10

# The " AQI" and " RGB" unit labels are deliberately NOT here: airlink.py
# registers them globally, WeeWX reads them from there, and an entry in
# this file would have no effect.  Both are acronyms and stay untranslated.

[ImageGenerator]

    [[year_images]]

        # Day.month. rather than the US month/day order
        x_label_format = %d.%m.

[Texts]

    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "Luftkvalitet i {location}"
    "Air Quality" = "Luftkvalitet"
    "Unavailable" = "Ikke tilgjengelig"

    # Card headings
    "Right now" = "Akkurat nå"
    "The last 24 hours, hour by hour" = "De siste 24 timene, time for time"
    "History" = "Historie"

    # Stat tiles
    "Today's peak" = "Dagens høyeste"
    "Today's average" = "Dagens gjennomsnitt"
    "Today's low" = "Dagens laveste"
    "Hours above Good" = "Timer over God"
    "in the last 24 hours" = "i løpet av de siste 24 timene"

    # The six US EPA AQI categories, lowest first
    "Good" = "God"
    "Moderate" = "Moderat"
    "Unhealthy for Sensitive Groups" = "Usunn for følsomme grupper"
    "Unhealthy" = "Usunn"
    "Very Unhealthy" = "Svært usunn"
    "Hazardous" = "Farlig"

    # One health sentence per category, in the same order
    "Air quality is satisfactory, and air pollution poses little or no risk." = "Luftkvaliteten er tilfredsstillende, og luftforurensningen utgjør liten eller ingen risiko."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Akseptabel.  Uvanlig følsomme personer bør vurdere å begrense langvarig anstrengelse utendørs."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "Følsomme grupper kan få helseplager.  Det er mindre sannsynlig at befolkningen ellers blir berørt."
    "Some members of the general public may experience health effects." = "Enkelte i befolkningen kan få helseplager."
    "Health alert: the risk of health effects is increased for everyone." = "Helsevarsel: risikoen for helseplager er økt for alle."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Helseadvarsel om nødsituasjon: alle er mer utsatt for å bli berørt."

    # Plot-period tabs, as in WeeWX's own Seasons skin
    "Day" = "Dag"
    "Week" = "Uke"
    "Month" = "Måned"
    "Year" = "År"

# skins/airlink/lang/it.conf
#
# Italian -- Italiano.  The plot-period tabs (Giorno, Settimana, Mese,
# Anno) and "History" (Storico) are copied verbatim from the Italian lang
# file of WeeWX's own Seasons skin (a test pins this).  Corrections
# welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airlink/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Observation labels: the page's readouts, and the y-axis/legend
        # label of the PNG plots.  Decimal comma, as everywhere in Italian.
        pm2_5_aqi = "Indice di qualità dell'aria"
        pm1_0     = "PM1,0"
        pm2_5     = "PM2,5"
        pm10_0    = PM10

# The " AQI" and " RGB" unit labels are deliberately NOT here: airlink.py
# registers them globally, WeeWX reads them from there, and an entry in
# this file would have no effect.  Both are acronyms and stay untranslated.

[ImageGenerator]

    [[year_images]]

        # Day/month rather than the US month/day order
        x_label_format = %d/%m

[Texts]

    # The page heading and the browser title: the station's own name,
    # from [Station] location in weewx.conf.  Translate the whole
    # phrase, preposition and all -- {location} may sit anywhere in it.
    "{location} Air Quality" = "Qualità dell'aria a {location}"
    "Air Quality" = "Qualità dell'aria"
    "Unavailable" = "Non disponibile"

    # Card headings
    "Right now" = "In questo momento"
    "The last 24 hours, hour by hour" = "Le ultime 24 ore, ora per ora"
    "History" = "Storico"

    # Stat tiles
    "Today's peak" = "Massimo di oggi"
    "Today's average" = "Media di oggi"
    "Today's low" = "Minimo di oggi"
    "Hours above Good" = "Ore oltre Buona"
    "in the last 24 hours" = "nelle ultime 24 ore"

    # The six US EPA AQI categories, lowest first
    "Good" = "Buona"
    "Moderate" = "Moderata"
    "Unhealthy for Sensitive Groups" = "Malsana per i gruppi sensibili"
    "Unhealthy" = "Malsana"
    "Very Unhealthy" = "Molto malsana"
    "Hazardous" = "Pericolosa"

    # One health sentence per category, in the same order
    "Air quality is satisfactory, and air pollution poses little or no risk." = "La qualità dell'aria è soddisfacente e l'inquinamento atmosferico comporta un rischio minimo o nullo."
    "Acceptable.  Unusually sensitive people should consider limiting prolonged outdoor exertion." = "Accettabile.  Le persone particolarmente sensibili dovrebbero valutare di limitare gli sforzi prolungati all'aperto."
    "Sensitive groups may experience health effects.  The general public is less likely to be affected." = "I gruppi sensibili possono subire effetti sulla salute.  È meno probabile che la popolazione in generale ne risenta."
    "Some members of the general public may experience health effects." = "Alcune persone della popolazione generale possono subire effetti sulla salute."
    "Health alert: the risk of health effects is increased for everyone." = "Allerta sanitaria: il rischio di effetti sulla salute aumenta per tutti."
    "Health warning of emergency conditions: everyone is more likely to be affected." = "Avviso sanitario di emergenza: tutti hanno maggiori probabilità di subirne gli effetti."

    # Plot-period tabs, as in WeeWX's own Seasons skin
    "Day" = "Giorno"
    "Week" = "Settimana"
    "Month" = "Mese"
    "Year" = "Anno"
